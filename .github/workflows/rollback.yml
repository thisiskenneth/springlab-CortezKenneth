## KENNETH CORTEZ
name: Rollback Render Service

on:
  workflow_dispatch:  # Permite ejecutar el rollback manualmente desde la pestaña Actions

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Trigger Render Rollback
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/$SERVICE_ID/deploys/rollback
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
