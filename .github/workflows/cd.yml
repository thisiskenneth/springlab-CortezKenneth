## KENNETH CORTEZ
name: CD - Deploy to Render

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      # Número de ejecución del pipeline CI
      APP_VERSION: ${{ github.run_number }}

    steps:
      - name: 🚀 Trigger Render Deploy Hook (with version)
        run: |
          echo "Deploying version: $APP_VERSION"
          curl -X POST "$RENDER_DEPLOY_HOOK&env%5BAPP_VERSION%5D=$APP_VERSION"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          APP_VERSION: ${{ github.run_number }}

  rollback_if_failed:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Automatic Rollback in Render
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/$SERVICE_ID/deploys/rollback
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
