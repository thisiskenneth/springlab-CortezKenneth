### KENNETH CORTEZ
name: CD - Deploy to Render

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📌 Generate APP_VERSION
        run: echo "APP_VERSION=${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> $GITHUB_ENV

      - name: 📌 Set version in Render
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"envVars":[{"key":"APP_VERSION","value":"'"$APP_VERSION"'"}]}' \
            https://api.render.com/v1/services/$SERVICE_ID
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

      - name: 🚀 Trigger Render Deploy Hook
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  rollback_if_failed:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Automatic Rollback in Render
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/$SERVICE_ID/deploys/rollback
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
